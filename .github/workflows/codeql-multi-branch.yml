name: "CodeQL Advanced - Multi Branch Scan"

on:
  push:
    branches:
      - main
      - bug/*
      - dev
      - qas
      - release/*
      - fix/*
  pull_request:
    branches:
      - main
      - qas
      - dev
  schedule:
    - cron: '0 0 * * 0'  # Escaneia toda semana (domingo meia-noite)
  workflow_dispatch:      # Permite execução manual

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: dockerfile
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-and-quality  # Inclui queries de segurança e qualidade

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
